[package]
name = "ncp-matcher"
description = "plug and play high performance fuzzy matcher"
authors = ["Pascal Kuthe <pascalkuthe@pm.me>", "Alex Rutar <alex@rutar.org>"]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/alexrutar/ncp-engine"
readme = "../README.md"

[dependencies]
memchr = "2.7.6"
unicode-segmentation = { version  = "1.12", optional = true }

[features]
default = ["unicode-normalization", "unicode-casefold", "unicode-segmentation"]
unicode-normalization = []
unicode-casefold = []
unicode-segmentation = ["dep:unicode-segmentation"]
