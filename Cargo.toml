[package]
name = "ncp-engine"
description = "High performance fuzzy matcher engine"
authors = ["Pascal Kuthe <pascalkuthe@pm.me>", "Alex Rutar <alex@rutar.org>"]
version = "0.2.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/alexrutar/ncp-engine"
readme = "README.md"

[lib]

[dependencies]
ncp-matcher = { version = "0.2.1", path = "matcher", package = "ncp-matcher" }
parking_lot = { version = "0.12.5", features = ["send_guard", "arc_lock"] }
rayon = "1.11.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "insertion"
harness = false

[workspace]
members = ["matcher"]

[lints.clippy]
print_stdout = "warn"
redundant_closure_for_method_calls = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"
